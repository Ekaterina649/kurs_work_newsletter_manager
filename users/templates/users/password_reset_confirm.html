{% extends 'mailings/base.html' %}

{% block content %}
<h2>Установите новый пароль</h2>

{% if validlink %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сменить пароль</button>
</form>
{% else %}
<p>Ссылка недействительна или устарела. Пожалуйста, запросите сброс пароля заново.</p>
{% endif %}
{% endblock %}
