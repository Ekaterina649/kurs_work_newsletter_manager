{% extends "mailings/base.html" %}
{% block title %}Пользователи{% endblock %}

{% block content %}
<h2>Список пользователей</h2>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Email</th>
            <th>Имя</th>
            <th>Активен</th>
        </tr>
    </thead>
    <tbody>
        {% for u in users %}
        <tr>
            <td>{{ u.email }}</td>
            <td>{{ u.get_full_name|default:"-" }}</td>
            <td>{{ u.is_active|yesno:"Да,Нет" }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3">Пользователей нет</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
