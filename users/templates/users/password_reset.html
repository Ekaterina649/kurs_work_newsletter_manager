{% extends 'mailings/base.html' %}
{% load i18n %}

{% block content %}
<h2>Восстановление пароля</h2>
<p>Введите ваш email — мы отправим ссылку для сброса пароля.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Отправить</button>
</form>
{% endblock %}
