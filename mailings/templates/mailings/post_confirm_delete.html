{% extends 'mailings/base.html' %}

{% block content %}
<h2>Удаление</h2>

<p>Вы уверены, что хотите удалить объект?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="javascript:history.back()" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
