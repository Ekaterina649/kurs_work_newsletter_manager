{% extends "mailings/base.html" %}

{% block title %}Главная{% endblock %}

{% block content %}
<h1 class="mb-4">Сервис рассылок</h1>

<div class="row">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h5>Всего рассылок</h5>
                <h2>{{ total_mailings }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h5>Активные рассылки</h5>
                <h2 class="text-success">{{ active_mailings }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h5>Получатели</h5>
                <h2>{{ total_clients }}</h2>
            </div>
        </div>
    </div>
</div>
{% endblock %}
