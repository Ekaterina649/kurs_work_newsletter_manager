{% extends 'mailings/base.html' %}

{% block title %}Клиент{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="mb-4">Клиент</h4>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <div class="text-end">
                        <button type="submit" class="btn btn-success">
                            Сохранить
                        </button>
                        <a href="{% url 'mailings:client_list' %}" class="btn btn-secondary">
                            Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
